/* v0.3 · login de demostración y anuncios multimedia */
.announcement-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:30px}
.announcement-card{overflow:hidden;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:24px}
.card-media{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid var(--border)}.hero-media{display:block;width:100%;aspect-ratio:32/9;object-fit:cover;border-radius:16px;margin-bottom:16px}.home-visitor{margin-top:32px}.visitor-grid{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:860px){.visitor-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:599px){.visitor-grid{grid-template-columns:1fr}.hero-media{aspect-ratio:16/7;object-position:left}}
.announcement-header{margin-top:30px}.announcements-header{align-items:end;margin:35px 0 17px}
.announcements-header .eyebrow{margin-bottom:5px}.announcement-body{padding:17px 19px 20px}
.announcement-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--coppertext);font-weight:700;font-size:12px;letter-spacing:.7px;text-transform:uppercase;margin-bottom:10px}
.announcement-meta span:last-child{color:var(--text3);font-weight:600;text-transform:none;letter-spacing:0}
.announcement-body h3{font-size:20px;letter-spacing:-.4px;line-height:1.25;margin:0 0 8px}.announcement-body p{font-size:13px;line-height:1.5;color:var(--text2);margin:0}
.media-visual{aspect-ratio:16/9;position:relative;overflow:hidden;background:#31261e;color:#faf7f2;display:flex;align-items:stretch;isolation:isolate}
.media-visual:before{content:'';position:absolute;inset:auto -10% -55% auto;width:70%;aspect-ratio:1;border-radius:50%;border:45px solid #c8956c26;z-index:-1}
.media-visual:after{content:'';position:absolute;inset:-38% auto auto -18%;width:52%;aspect-ratio:1;border-radius:50%;background:#c8956c16;z-index:-1}
.media-poster-content{display:flex;flex-direction:column;justify-content:space-between;padding:21px;min-height:100%;position:relative;z-index:1;width:100%}
.media-overline{font-weight:700;color:#d9ad86;letter-spacing:2.2px;font-size:12px}
.media-poster-title{font-size:clamp(21px,2.7vw,35px);line-height:1.1;font-weight:800;letter-spacing:-.6px;max-width:80%;color:#fff}
.media-poster-foot{color:#e6c9b0;letter-spacing:.8px;font-weight:600;font-size:12px}
.media-img{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover}
.media-img+.media-play{z-index:2}.media-play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:65px;height:65px;background:#1a1a1ada;color:#f0d5bd;border:1px solid #f0d5bd90;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.media-play svg{width:29px;height:29px;fill:currentColor;stroke:none;margin-left:3px}
.media-type-icon{position:absolute;z-index:2;right:14px;bottom:14px;color:#fff;background:#1a1a1acc;border-radius:16px;padding:7px;display:flex}
.media-trigger{padding:0;border:0;background:transparent;display:block;width:100%;text-align:left;color:inherit}
button.media-trigger:hover .media-play{background:#82552f;color:#fff}
.video-holder{aspect-ratio:16/9;background:#000;margin:8px 0 14px}.video-player{width:100%;height:100%;border:0;display:block}
.login-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,1fr);gap:24px;max-width:1100px;margin:10px auto;align-items:stretch}
.login-hero{background:#1a1a1a;color:#f0f0f0;border:1px solid #343434;padding:42px 34px;border-radius:24px;min-height:545px;display:flex;flex-direction:column;justify-content:flex-start}

.login-panel h2{font-size:30px;margin:6px 0 10px;letter-spacing:-.5px}.login-panel p.muted{font-size:14px;margin-bottom:20px}.login-fields{display:grid;gap:9px}.login-fields .label{margin:7px 0 0}.login-fields input:disabled{opacity:.55;cursor:not-allowed}

.demo-roles{display:grid;gap:10px}.demo-roles .btn{width:100%;justify-content:center}.text-link{border:0;color:var(--coppertext);padding:16px 10px;background:transparent;display:block;text-align:center;margin:auto;font-weight:600}

/* v0.5 — movimiento sobrio y funcional; preserva la identidad Shalom. */

@keyframes shalom-modal{from{opacity:0;transform:translate3d(0,10px,0) scale(.986)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes shalom-mask{from{opacity:0}to{opacity:1}}
@keyframes shalom-confirm{0%{transform:scale(.96)}60%{transform:scale(1.025)}100%{transform:scale(1)}}
.motion-route>.page-head,.motion-route>.feature,.motion-route>.section-row,.motion-route>.announcement-grid,.motion-route>.grid,.motion-route>.panel,.motion-route>.login-layout{animation:shalom-reveal .38s cubic-bezier(.2,.7,.2,1) both}
.motion-route>.feature{animation-delay:60ms}
.motion-route>.announcements-header,.motion-route>.section-row{animation-delay:110ms}
.motion-route>.announcement-grid,.motion-route>.grid{animation-delay:155ms}
.motion-route .announcement-card{animation:shalom-reveal .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:180ms}
.motion-route .announcement-card:nth-child(2){animation-delay:235ms}
.nav-link,.tile,.btn,.tiny-btn,.media-play,.announcement-card,.modal-close{transition:background-color .18s,border-color .18s,color .18s,transform .18s cubic-bezier(.2,.7,.2,1)}

function conoce(){const items=[['Nuestra comunidad','assets/prueba/comunidad.svg','Este domingo hay un espacio para ti. Te esperamos a las [hora] en [lugar].'],['Actividades del mes','assets/prueba/eventos.svg','Grupos, cursos y servicio para cada etapa. Próxima actividad: [fecha].'],['Avisos de la semana','assets/prueba/avisos.svg','Consulta lo más reciente y elige cómo recibirlo. Siguiente aviso: [fecha].']];return `<section class="home-visitor" aria-labelledby="home-visitor-heading"><div class="section-row"><div><p class="eyebrow">CONTENIDO DE PRUEBA</p><h2 class="section-title" id="home-visitor-heading">Conoce Shalom</h2></div></div><div class="grid visitor-grid">${items.map(([t,img,txt])=>`<article class="announcement-card"><img class="card-media" src="${img}" alt="Imagen de prueba" loading="lazy"><div class="announcement-body"><h3>${X(t)}</h3><p>${X(txt)}</p></div></article>`).join('')}</div></section>`}
function mediaCard(n,featured=false,img=''){const kind=n.kind||'texto';return `<article class="announcement-card ${featured?'announcement-featured':''}">${img?`<img class="card-media" src="${img}" alt="Imagen de prueba" loading="lazy">`:''}<div class="announcement-body"><div class="announcement-meta"><span>${kind==='video'?'VIDEO':kind==='imagen'?'IMAGEN':'COMUNICADO'}</span><span>${X(dateHuman(n.date))}</span></div><h3>${X(n.title)}</h3><p>${X(n.body)}</p><a class="btn secondary sm space-top" href="comunicaciones.html#avisos">Abrir comunicaciones</a></div></article>`}
function login(){return `<div class="login-layout"><section class="login-hero"><p class="eyebrow">UNA CASA PARA TODOS</p><h1 class="h1">Bienvenido de nuevo.</h1><p class="lead">Tu familia, tus actividades y tu servicio en un solo lugar.</p><div class="login-mark">${I('shield')}<span>El acceso real llegará cuando habilitemos cuentas verificadas y permisos seguros.</span></div><div class="login-brand-note">SHALOM · UNA CASA PARA TODOS</div></section><section class="login-panel"><p class="eyebrow">MI CUENTA</p><h2>Iniciar sesión</h2><p class="muted">En esta versión puedes probar la experiencia sin crear cuenta ni utilizar contraseñas.</p><div class="login-fields"><label class="label" for="login-mail-preview">Correo electrónico</label><input id="login-mail-preview" type="email" placeholder="tu-correo@ejemplo.com" autocomplete="off" disabled aria-describedby="login-disabled"><label class="label" for="login-pass-preview">Contraseña o código de acceso</label><input id="login-pass-preview" type="text" placeholder="Disponible en la versión real" disabled><p class="tiny" id="login-disabled">Acceso con correo o código: próximamente. No introduzcas tus credenciales reales en esta demo.</p></div><div class="login-divider"><span>EXPLORAR UNA CUENTA DE PRUEBA</span></div><div class="demo-roles"><button class="btn" data-action="signin" data-id="persona">${I('person')} Entrar como congregante ${I('arrow')}</button><button class="btn secondary" data-action="signin" data-id="voluntario">${I('users')} Entrar como voluntario</button><button class="btn secondary" data-action="signin" data-id="admin">${I('settings')} Entrar a administración</button></div><button class="text-link" data-action="goto" data-id="home">Continuar como visitante</button>${notice('<strong>Modo demostración.</strong> Estos botones cambian la vista y no son un inicio de sesión seguro.')}</section></div>`}
function videoOpen(id){const n=state.notices.find(x=>x.id===id),url=validHttps(n?.url);if(!n||!url){notify('Este anuncio todavía no tiene un video.');return}const yt=youtubeId(url);const isMp4=/\.mp4(?:$|[?#])/i.test(url);if(!yt&&!isMp4){notify('Usa un enlace de YouTube o un video MP4 seguro.');return}const player=yt?`<iframe class="video-player" src="https://www.youtube-nocookie.com/embed/${yt}?rel=0" title="${X(n.title)}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`:`<video class="video-player" controls playsinline preload="none" src="${X(url)}"></video>`;openModal('Video · '+n.title,`<div class="video-holder">${player}</div><p class="tiny">Contenido publicado a través de un servicio de video externo. Al reproducirlo aplican las condiciones de dicho proveedor.</p>`)}
function noticeAllowed(kind,url){if(kind==='texto')return true;if(!validHttps(url))return false;if(kind==='imagen')return /^(https:\/\/)/.test(url);return !!youtubeId(url)||/\.mp4(?:$|[?#])/i.test(url)}
function home(){
  const isAdmin=state.role==='admin', isVol=state.role==='voluntario';
  const priorities=isAdmin?[
    ['Resumen administrativo','Revisa el estado general de la iglesia.','chart','admin'],
    ['Personas y familias','Consulta los registros de ejemplo.','users','people'],
    ['Eventos','Revisa actividades e inscripciones.','calendar','events']
  ]:isVol?[
    ['Mi próxima clase','Consulta tu agenda docente y próximos servicios.','calendar','agenda'],
    ['Mi espacio Kids','Prepara clases y registra la asistencia de prueba.','book','kids'],
    ['Estacionamiento','Consulta el cupo disponible.','car','parking']
  ]:state.session?[
    ['Estacionamiento','Consulta el cupo para tu próxima visita.','car','parking'],
    ['Eventos','Revisa actividades e inscripciones.','calendar','events'],
    ['Mi familia','Gestiona tus integrantes de ejemplo.','users','family']
  ]:[
    ['Estacionamiento','Consulta la disponibilidad de ejemplo.','car','parking'],
    ['Eventos','Revisa las próximas actividades.','calendar','events'],
    ['Avisos','Consulta las noticias de la iglesia.','bell','notices']
  ];
  const services=[
    ['Estacionamiento','Consulta cupo y reserva tu llegada.','car','parking'],
    ['Mi familia','Perfiles, tutores y asistencias.','users','family'],
    ['Eventos','Actividades e inscripciones.','calendar','events'],
    ['Aportaciones','Historial privado y registros.','heart','giving'],
    ['Shalom Kids','Información del ministerio infantil.','book','kids'],
    ['Cafetería','Consulta el menú y prepara un pedido.','coffee','cafe'],
    ...(isAdmin?[['Proyectos','Seguimiento de iniciativas de prueba.','chart','projects']]:[]),
    ...(isVol?[['Voluntariado','Herramientas del equipo de servicio.','clipboard','volunteer']]:[])
  ];
  const otherServices=services.filter(item=>!priorities.some(p=>p[3]===item[3]));
  const main=priorities[0];
  return `${head('UNA CASA PARA TODOS',isAdmin?'Tu espacio de administración.':isVol?'Gracias por servir.':'Bienvenido a casa.',isAdmin?'Gestiona lo importante desde un mismo lugar.':isVol?'Tu próxima clase y tus responsabilidades, a la mano.':'Consulta actividades, organiza tu visita y acompaña a tu familia.')}
  <section class="feature home-hero" aria-label="Acción principal"><img class="hero-media" src="assets/prueba/comunidad-ancha.svg" alt="Imagen de prueba"><div class="feature-top"><div><p class="eyebrow">${isAdmin?'GESTIÓN INTEGRAL':isVol?'SERVICIO EN SHALOM':'DOMINGO EN SHALOM'}</p><h2>${X(main[0])}</h2><p>${X(main[1])}</p></div><span class="icon-disc ico-lg">${I(main[2])}</span></div><div class="feature-action">${buttons([{text:main[0],icon:'arrow',action:'goto',arg:main[3]}])}</div></section>
  <section class="home-priorities" aria-labelledby="home-priority-heading"><div class="section-row"><div><p class="eyebrow">SEGÚN TU PERFIL DE PRUEBA</p><h2 class="section-title" id="home-priority-heading">También puedes</h2></div></div><div class="grid priority-grid">${priorities.slice(1).map(item=>tile(...item)).join('')}</div></section>
  <section class="home-announcements" aria-labelledby="home-announcements-heading"><div class="section-row announcements-header"><div><p class="eyebrow">NOVEDADES Y COMUNICADOS</p><h2 class="section-title" id="home-announcements-heading">Lo que está pasando en Shalom</h2></div><button class="btn tertiary sm" data-action="goto" data-id="notices">Ver todos ${I('arrow')}</button></div><div class="announcement-grid">${visibleNotices().slice(0,2).map((n,i)=>mediaCard(n,i===0,['assets/prueba/avisos.svg','assets/prueba/eventos.svg'][i])).join('')}</div></section>
  ${state.session?'':conoce()}
  <section class="home-services" aria-labelledby="home-services-heading"><div class="section-row"><h2 class="section-title" id="home-services-heading">Explora otras funciones</h2></div><div class="grid service-grid">${otherServices.map(item=>tile(...item)).join('')}</div></section>
  ${notice('<strong>Versión de demostración.</strong> Todos los nombres, cupos, montos y fechas son ficticios. Esta aplicación no está conectada a los registros actuales de Shalom.')}`;
}
function parking(){const s=service(),free=availability(state.service),percent=Math.min(100,(s.occupied/state.parking.capacity)*100); const r=reservation();return `${head('ORGANIZA TU VISITA','Estacionamiento','Consulta la disponibilidad estimada y aparta un espacio para la actividad a la que asistirás.')}<section class="panel"><p class="eyebrow">SELECCIONA UN SERVICIO</p><div class="pill-select">${state.parking.services.map(v=>`<button type="button" class="${v.id===state.service?'active':''}" data-action="service" data-id="${v.id}">${X(v.label)}</button>`).join('')}</div><div class="grid cols3"><div class="mini-stat"><span class="tiny">Disponibles</span><div class="metric-num">${free}</div></div><div class="mini-stat"><span class="tiny">Ocupados (ejemplo)</span><div class="metric-num">${s.occupied}</div></div><div class="mini-stat"><span class="tiny">Reservados pendientes</span><div class="metric-num">${resFor(s.id).length}</div></div></div><div class="bar-bg"><div class="bar-fill" style="width:${percent}%"></div></div><p class="tiny space-top">Capacidad operativa provisional: ${state.parking.capacity} vehículos. Puede cambiar según las condiciones y el tamaño de los automóviles.</p><div class="btnrow space-top">${r?buttons([{text:'Ver mi reservación',action:'reserve-show',icon:'receipt'}]):buttons([{text:'Reservar espacio',action:'reserve',icon:'car'}])}${buttons([{text:'Consultar avisos',action:'goto',arg:'notices',secondary:true}])}</div></section><div class="two-col"><section class="panel"><h2 class="section-title">Cómo funciona</h2>${row('1 · Elige tu actividad','Sin seleccionar cajón')}${row('2 · Reserva si hay cupo','Confirmación de prueba')}${row('3 · Al llegar','Presenta tu código')}${row('4 · El voluntario','Valida tu entrada')}</section><section class="panel"><h2 class="section-title">Antes de salir</h2><p class="muted">La disponibilidad se calcula con los movimientos que registran los voluntarios. Sin sensores, el dato depende de que se actualice correctamente.</p>${notice('Las reservaciones y tolerancias de llegada están pendientes de validación con la coordinación de estacionamiento.')}</section></div>`}
function family(){return `${head('TU NÚCLEO FAMILIAR','Mi familia','Cada persona tiene su propia identidad. La información de menores solo está disponible para tutores autorizados.')}<section class="panel"><div class="section-row"><h2 class="section-title">${X(state.family.name)}</h2>${buttons([{text:'Agregar integrante',action:'add-member',icon:'plus',sm:true}])}</div><div class="grid">${state.family.members.map(m=>`<div class="item-card"><div class="item-head"><span class="icon-disc">${I(m.type==='menor'?'book':'person')}</span><div class="item-main"><h3>${X(m.name)}</h3><p>${X(m.relationship)} · ${X(m.id)}</p></div>${tags(m.verified?'Verificado':'Pendiente')}</div>${m.type==='menor'?`<div class="item-foot"><button class="btn secondary sm" data-action="goto" data-id="kids">Ver Shalom Kids</button>${!m.verified?`<span class="tiny">Validación de tutor pendiente</span>`:''}</div>`:''}</div>`).join('')}</div></section><section class="panel"><h2 class="section-title">Relaciones y privacidad</h2>${row('Adultos registrados',state.family.members.filter(x=>x.type==='adulto').length)}${row('Menores registrados',state.family.members.filter(x=>x.type==='menor').length)}${row('Relaciones por verificar',state.family.members.filter(x=>!x.verified).length)}${notice('Pertenecer a una familia no concede automáticamente acceso a datos sensibles ni a la asistencia de todos sus integrantes. Los tutores deben verificarse.')}</section>`}
function events(){return `${head('ENCUENTROS Y ACTIVIDADES','Eventos','Inscríbete en actividades dentro o fuera de la iglesia y revisa sus detalles.')}${state.role==='admin'?`<div class="btnrow" style="margin:0 0 17px"><button class="btn" data-action="add-event">${I('plus')} Crear evento de prueba</button></div>`:''}<div class="grid">${state.events.map(e=>{let enrolled=e.registered.includes(state.demoPerson);let full=e.registered.length>=e.capacity;return `<section class="item-card"><div class="item-head"><span class="icon-disc">${I('calendar')}</span><div class="item-main"><h3>${X(e.title)}</h3><p>${X(dateHuman(e.date))} · ${X(e.time)}</p><p>${I('pin')} ${X(e.place)}</p></div></div><div class="item-foot"><span class="tag">${e.external?'Sede externa':'En Shalom'}</span>${e.price?`<span class="tag">Cooperación: ${money(e.price)}</span>`:'<span class="tag">Sin cooperación</span>'}</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,e.registered.length/e.capacity*100)}%"></div></div><div class="item-foot"><span class="tiny">${countLabel(e.registered.length,'inscripción','inscripciones')} · Cupo de ejemplo: ${e.capacity}</span><button class="btn ${enrolled?'secondary':''} sm" data-action="${enrolled?'event-cancel':'event-enroll'}" data-id="${e.id}" ${(!enrolled&&full)?'disabled':''}>${enrolled?'Cancelar inscripción':full?'Cupo lleno':'Inscribirme'}</button></div><div class="space-top"><button class="btn secondary" data-family-event="${X(e.id)}">Inscripción familiar</button><p class="tiny">Familia inscrita: ${state.session?(state.family.members.filter(m=>e.registered.includes(m.id)).map(m=>X(m.name)).join(', ')||'Nadie todavía'):'Ingresa con un perfil de prueba para consultar.'}</p></div></section>`}).join('')}</div>${notice('Las fechas, los cupos y las cooperaciones de esta pantalla son datos de prueba. Las inscripciones no se envían a los organizadores.')}`}
function kids(){const arr=state.family.members.filter(m=>m.type==='menor');let recent=state.kids.attendance.filter(x=>arr.some(a=>a.id===x.student)); return `${head('MINISTERIO INFANTIL','Shalom Kids','El sistema de asistencia existente seguirá funcionando hasta realizar una integración controlada.')}<div class="kids-context"><p class="eyebrow">TESOROS DEL REY · PRIMARIOS</p><h2 class="section-title">Acompañamos su crecimiento.</h2><p class="muted">Consulta los registros de demostración asociados a menores con relación familiar verificada.</p><div class="grid space-top">${arr.map(m=>`<div class="panel" data-kids-status="${m.verified?'verified':'pending'}"><div class="item-head"><span class="icon-disc">${I('book')}</span><div class="item-main"><h3>${X(m.name)}</h3><p>${X(m.id)}</p></div></div><div class="space-top">${m.verified?tags('Verificado'):tags('Pendiente')}</div><p class="tiny space-top">${m.verified?'Consulta autorizada de ejemplo':'La validación de tutor debe completarse antes de habilitar la consulta.'}</p></div>`).join('')}</div>${state.role!=='persona'?`<section class="panel space-top" data-kids-module="attendance"><h2 class="section-title">Registrar asistencia de prueba</h2><p class="muted">Selecciona un perfil y registra una entrada en esta demostración. No envía registros a Google Sheets.</p><form data-form="attendance"><div class="form-grid">${selectField('student','Alumno',arr.map(m=>[m.id,m.name]))}${selectField('group','Grupo',[['Tesoros del Rey (4–6)','Tesoros del Rey (4–6)'],['Primarios (7–12)','Primarios (7–12)']])}${selectField('status','Movimiento',[['Presente','Entrada / Presente'],['Salida','Salida']])}<div class="form-field" style="align-self:end"><button class="btn block" type="submit">${I('check')} Registrar</button></div></div></form></section>`:''}<section class="panel space-top"><h2 class="section-title">Asistencia reciente</h2>${recent.filter(r=>state.family.members.find(m=>m.id===r.student)?.verified).map(a=>`${row(`${X(state.family.members.find(m=>m.id===a.student)?.name||a.student)} · ${X(dateHuman(a.date))}`,tags(a.status))}`).join('')||'<p class="empty">Aún no hay asistencias registradas para mostrar.</p>'}${notice('No hay conexión con Google Sheets ni se modifican los QR actuales. Esta vista utiliza alumnos y asistencias de prueba.')}</section></div>`}
function giving(){const mine=state.giving.filter(d=>d.person===state.demoPerson),sum=mine.filter(d=>d.status==='Confirmada').reduce((a,d)=>a+d.amount,0);return `${head('APORTACIONES PERSONALES','Aportaciones','Un espacio privado para organizar diezmos, ofrendas y cooperaciones.')}<div class="grid cols3"><div class="mini-stat"><span class="tiny">Confirmadas · ejemplo</span><div class="metric-num">${money(sum)}</div></div><div class="mini-stat"><span class="tiny">Registros personales</span><div class="metric-num">${mine.length}</div></div><div class="mini-stat"><span class="tiny">Pendientes</span><div class="metric-num">${mine.filter(d=>d.status!=='Confirmada').length}</div></div></div><section class="panel space-top"><div class="section-row"><h2 class="section-title">Historial personal</h2><button class="btn sm" data-action="add-giving">${I('plus')} Registrar aportación</button></div>${mine.length?mine.map(d=>`<div class="rowline"><div><strong>${X(d.concept)}</strong><div class="tiny">${X(dateHuman(d.date))} · ${X(d.method)} · ${X(d.id)}</div></div><div style="text-align:right"><strong>${money(d.amount)}</strong><div>${tags(d.status)}</div></div></div>`).join(''):'<div class="empty">Aún no hay movimientos registrados en esta demostración.</div>'}${buttons([{text:'Solicitar estado por correo',action:'giving-csv',icon:'download',secondary:true,sm:true}])}</section>${state.role==='admin'?`<section class="panel"><h2 class="section-title">Conciliación de prueba · Administración</h2><p class="muted">En producción esta sección deberá reservarse a finanzas, no a todos los administradores.</p>${state.giving.filter(x=>x.status==='Pendiente').map(d=>`<div class="rowline"><div><strong>${X(d.concept)}</strong><div class="tiny">${X(d.id)} · ${X(d.method)}</div></div><div class="btnrow"><strong>${money(d.amount)}</strong><button class="btn sm" data-action="confirm-giving" data-id="${d.id}">Conciliar demo</button></div></div>`).join('')||'<p class="empty">Aún no hay aportaciones pendientes de revisar.</p>'}</section>`:''}${notice('<strong>Importante:</strong> registrar una aportación no ejecuta un pago ni verifica una transferencia. No se generan recibos fiscales; las confirmaciones reales necesitarían conciliación y permisos financieros.')}`}
function cafe(){return `${head('CAFETERÍA SHALOM','Caja, cocina y seguimiento','Un solo registro del pedido para que el cliente vea cada artículo y cocina reciba la comanda con sus indicaciones.')}<section class="feature"><p class="eyebrow">CAFETERÍA · VERSIÓN 0.5</p><h2 class="section-title">Cafetería Shalom · Operación rápida</h2><p class="lead">Conoce las pantallas conectadas de caja, preparación por estaciones, seguimiento y recibo digital de ejemplo.</p><div class="feature-action"><a class="btn" href="./cafeteria.html">${I('coffee')} Abrir cafetería interactiva ${I('arrow')}</a></div><p class="tiny space-top">Este enlace abre un prototipo independiente. Los pedidos y precios son ficticios y no hay cobros, correos ni sincronización real entre dispositivos.</p></section><div class="grid cols3"><section class="item-card"><div class="item-head"><span class="icon-disc">${I('cart')}</span><div class="item-main"><h3>1 · Caja rápida</h3><p>Productos específicos, modificadores y total visible para el cliente.</p></div></div></section><section class="item-card"><div class="item-head"><span class="icon-disc">${I('clipboard')}</span><div class="item-main"><h3>2 · Preparación</h3><p>Comandas para bebidas y alimentos que avanzan por separado.</p></div></div></section><section class="item-card"><div class="item-head"><span class="icon-disc">${I('receipt')}</span><div class="item-main"><h3>3 · Seguimiento</h3><p>Número de pedido, progreso y recibo digital de demostración.</p></div></div></section></div>${notice('Diseño en prueba: el sistema actual de caja, la terminal Mercado Pago y Shalom Kids no se han modificado.')}`}
function projects(){return `${head('MEJORAS Y RECURSOS','Proyectos','Consulta el avance de propuestas de mejora y sus presupuestos de demostración.')}<div class="grid">${state.projects.filter(p=>p.public||state.role==='admin').map(p=>{let pct=p.budget?Math.min(100,p.spent/p.budget*100):0;return `<section class="item-card"><div class="item-head"><span class="icon-disc">${I('chart')}</span><div class="item-main"><h3>${X(p.title)}</h3><p>${X(p.description)}</p></div></div><div class="item-foot">${tags(p.status)}<span class="tiny">Presupuesto: ${money(p.budget)}</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><div class="item-foot"><span class="tiny">Gastado: ${money(p.spent)}</span><strong class="progress">${Math.round(pct)}%</strong></div>${state.role==='admin'?`<div class="space-top"><button class="btn secondary sm" data-action="expense" data-id="${p.id}">Registrar gasto</button></div>`:''}</section>`}).join('')}</div>${state.role==='admin'?buttons([{text:'Crear proyecto',action:'add-project',icon:'plus'}]):notice('Los montos mostrados son ilustrativos. Los proyectos reales y sus presupuestos requieren autorización administrativa.')}`}
function notices(){return `${head('VIDA EN COMUNIDAD','Avisos','Consulta novedades, elige tus preferencias y revisa privacidad en el módulo de demostración.')}<section class="panel"><h2 class="section-title">Cerca de lo que importa.</h2><div class="btnrow"><a class="btn" href="comunicaciones.html#avisos">Abrir avisos</a><a class="btn secondary" href="comunicaciones.html#preferencias">Preferencias</a><a class="btn secondary" href="comunicaciones.html#privacidad">Privacidad</a></div></section>`}
function profile(){if(!state.session)return login();return `${head('TU CUENTA','Mi perfil','La sesión actual es una simulación, sin identidad verificada.')}<section class="panel"><h2 class="section-title">Comunicación y privacidad</h2><p class="muted">Elige temas optativos y prueba las solicitudes de privacidad, sin enviar ni almacenar consentimientos reales.</p><div class="btnrow space-top"><a class="btn secondary" href="comunicaciones.html#preferencias">Preferencias</a><a class="btn secondary" href="comunicaciones.html#privacidad">Centro de privacidad</a></div></section><section class="panel"><h2 class="section-title">Sesión de demostración</h2>${row('Cuenta', 'Perfil ficticio')}${row('Experiencia', X(roleName()))}${row('Tema',state.theme==='night'?'Noche':'Crema')}<div class="btnrow space-top"><button class="btn secondary" data-action="roles">${I('users')} Cambiar perfil de prueba</button><button class="btn secondary" data-action="theme">${I('sun')} Cambiar tema</button><button class="btn secondary" data-action="signout">${I('logout')} Cerrar sesión</button></div></section><section class="panel"><h2 class="section-title">Datos de demostración</h2><p class="muted">Los cambios se guardan en este navegador, no se sincronizan con la iglesia.</p><div class="btnrow space-top"><button class="btn secondary" data-action="export">${I('download')} Solicitar mis datos por correo</button><button class="btn warn" data-action="reset">Restablecer demo</button></div></section>${notice('Este inicio de sesión no verifica identidad. No ingreses información real de menores, aportaciones, contraseñas o datos personales.')}`}
function volunteer(){const s=service();const res=state.parking.reservations.filter(r=>r.status==='Reservado');return `${head('SERVICIO VOLUNTARIO','Voluntariado','Controles grandes para registrar entradas, salidas y validar reservaciones en pocos pasos.')}<div class="pill-select">${state.parking.services.map(q=>`<button class="${state.service===q.id?'active':''}" data-action="service" data-id="${q.id}">${X(q.label)}</button>`).join('')}</div><section class="feature"><p class="eyebrow">ESTACIONAMIENTO · ${X(s.label).toUpperCase()}</p><div class="grid cols3"><div><span class="tiny">Vehículos dentro</span><div class="metric-num">${s.occupied}</div></div><div><span class="tiny">Disponibles</span><div class="metric-num">${availability(state.service)}</div></div><div><span class="tiny">Reservados</span><div class="metric-num">${resFor(state.service).length}</div></div></div><div class="feature-action"><button class="btn" data-action="movement-in">${I('plus')} Registrar entrada</button><button class="btn secondary" data-action="movement-out">${I('minus')} Registrar salida</button></div></section><section class="panel"><h2 class="section-title">Validar reservación</h2><form data-form="checkin"><div class="form-grid"><div class="form-field"><label class="label" for="code">Código de reservación</label><input name="code" id="code" placeholder="Ej. R-ABC123" autocomplete="off" required></div><div class="form-field" style="align-self:end"><button class="btn block" type="submit">${I('check')} Validar llegada</button></div></div></form><div class="space-top"><h3 style="font-size:14px">Reservaciones pendientes (${res.length})</h3>${res.length?res.slice(0,6).map(r=>row(`${X(r.id)} · ${X(state.parking.services.find(s=>s.id===r.service)?.label||r.service)}`,tags(r.status))).join(''):'<p class="tiny">Aún no hay reservaciones pendientes de confirmar.</p>'}</div></section><section class="panel"><h2 class="section-title">Otras tareas</h2><div class="grid">${tile('Asistencia Kids','Registro de ejemplo para docentes.','book','kids')}${tile('Eventos','Consulta y apoyo a inscripciones.','calendar','events')}</div></section>${notice('El lector de cámara y la conexión en tiempo real entre voluntarios requieren la implementación de backend. El código puede introducirse manualmente en esta demo.')}`}
function admin(){const confirmed=state.giving.filter(x=>x.status==='Confirmada'),pending=state.giving.filter(x=>x.status==='Pendiente');return `${head('PANEL ADMINISTRATIVO','Administración','Indicadores y accesos a operaciones. Todas las cifras se generan con datos de prueba.')}
<div class="grid cols4"><div class="mini-stat"><span class="tiny">Integrantes de ejemplo</span><div class="metric-num">${state.family.members.length}</div></div><div class="mini-stat"><span class="tiny">Capacidad de estacionamiento</span><div class="metric-num">${state.parking.capacity}</div></div><div class="mini-stat"><span class="tiny">Eventos</span><div class="metric-num">${state.events.length}</div></div><div class="mini-stat"><span class="tiny">Movimientos por conciliar</span><div class="metric-num">${pending.length}</div></div></div><div class="section-row"><h2 class="section-title">Acciones frecuentes</h2></div><div class="grid cols3">${tile('Personas','Vínculos y verificaciones.','users','people')}${tile('Estacionamiento','Capacidad y reservaciones.','car','parking')}${tile('Eventos','Inscripciones y cupos.','calendar','events')}${tile('Aportaciones','Conciliación y privacidad.','wallet','giving')}${tile('Proyectos','Gastos y presupuesto.','chart','projects')}${tile('Comunicados','Anuncios para la iglesia.','bell','notices')}</div><section class="panel space-top"><h2 class="section-title">Resumen financiero de ejemplo</h2>${row('Aportaciones confirmadas',money(confirmed.reduce((a,d)=>a+d.amount,0)))}${row('Movimientos pendientes',pending.length)}${row('Proyectos activos',state.projects.length)}${notice('La consulta de movimientos financieros reales requerirá un rol financiero específico, bitácora de auditoría y políticas de privacidad.')}</section>`}
function people(){return `${head('IDENTIDAD Y PERMISOS','Personas','Relaciones verificables sin CURP. Los registros identifican a cada persona por un ID interno.')}<section class="panel"><div class="section-row"><h2 class="section-title">Personas registradas</h2><button class="btn sm" data-action="add-member">${I('plus')} Alta de prueba</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Nombre</th><th>ID</th><th>Relación</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${state.family.members.map(m=>`<tr><td>${X(m.name)}</td><td>${X(m.id)}</td><td>${X(m.relationship)}</td><td>${tags(m.verified?'Verificado':'Pendiente')}</td><td>${!m.verified?`<button class="btn sm" data-action="verify-member" data-id="${m.id}">Verificar demo</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></section>${notice('Las verificaciones son simuladas. En producción deberá existir un procedimiento presencial o documental autorizado para tutores de menores.')}`}
function settings(){return `${head('CONFIGURACIÓN DE PRUEBA','Configuración','Los valores actuales son provisionales y no representan aforos oficiales.')}<section class="panel"><h2 class="section-title">Capacidad de estacionamiento</h2><form data-form="capacity"><div class="form-grid"><div><label class="label" for="capacity">Capacidad operativa (vehículos)</label><input name="capacity" id="capacity" type="number" min="1" max="300" value="${state.parking.capacity}" required></div><div style="align-self:end"><button class="btn block" type="submit">Guardar capacidad</button></div></div></form><p class="tiny space-top">Estimación inicial de 40 espacios de operación, sujeta a levantamiento físico y variaciones por tamaño de vehículos.</p></section><section class="panel"><h2 class="section-title">Otras herramientas</h2><div class="btnrow"><button class="btn secondary" data-action="add-event">${I('plus')} Nuevo evento</button><button class="btn secondary" data-action="add-project">${I('plus')} Nuevo proyecto</button><button class="btn secondary" data-action="add-notice">${I('plus')} Nuevo aviso</button><button class="btn secondary" data-action="add-product">${I('plus')} Producto cafetería</button></div></section><section class="panel"><h2 class="section-title">Bitácora local</h2>${state.log.length?state.log.slice(0,12).map(x=>row(X(x.message),`<span class="tiny">${X(x.date)}</span>`)).join(''):'<p class="empty">Aún no se han registrado acciones en este dispositivo.</p>'}</section>${notice('Los ajustes no se sincronizan con otros celulares. La administración real requiere autorización del servidor y registro de auditoría inalterable.')}`}
function page(){switch(state.screen){case'login':return login();case'parking':return parking();case'family':return family();case'events':return events();case'kids':return kids();case'agenda':return teacherAgenda();case'giving':return giving();case'cafe':return cafe();case'projects':return projects();case'notices':return notices();case'profile':return profile();case'volunteer':return state.role==='persona'?home():volunteer();case'admin':return state.role==='admin'?admin():home();case'people':return state.role==='admin'?people():home();case'settings':return state.role==='admin'?settings():home();default:return home()}}
function render(){window.ShalomNotifications.configure({context:()=>state.session?state.role:null});if(!state.session&&['agenda','family','kids','giving','cafe','projects','volunteer','admin','people','settings','profile'].includes(state.screen)){state.redirectAfterLogin=state.screen;state.screen='login'}document.body.className=state.theme==='night'?'theme-night':'theme-cream';document.getElementById('app').innerHTML=frame();const feedbackService=({home:'welcome',parking:'parking',events:'events',notices:'other',family:'kids',kids:'kids',cafe:'cafe',giving:'giving'})[state.screen]||'other';window.ShalomNavigation.mount(document.getElementById('main-view'),{service:feedbackService,visitor:!state.session,noticesInLocalNav:mobileNav().some(([id])=>id==='notices')});routeMotion=false;document.getElementById('dialog-host').innerHTML=modal?`<div class="modal-mask" data-dismiss="true"><div class="modal-box" role="dialog" aria-modal="true" aria-label="${X(modal.title)}"><div class="modal-top"><h2>${X(modal.title)}</h2><button class="modal-close" type="button" data-action="modal-close" aria-label="Cerrar">×</button></div>${modal.html}</div></div>`:'';store()}
function goto(screen){if(screen==='notices'){location.href='comunicaciones.html#avisos';return}if(!state.session&&['agenda','family','kids','giving','cafe','projects','volunteer','admin','people','settings','profile'].includes(screen)){state.redirectAfterLogin=screen;screen='login'}routeMotion=state.screen!==screen;state.screen=screen;modal=null;window.scrollTo({top:0,behavior:'instant'});render()}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.className='visible';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',3900)}
function openModal(title,html){modal={title,html};render();setTimeout(()=>document.querySelector('.modal-box input:not([type=hidden]),.modal-box select')?.focus(),30)}
function field(name,label,type='text',attrs='',value=''){return `<div class="form-field"><label class="label" for="f-${name}">${X(label)}</label><input id="f-${name}" name="${name}" type="${type}" ${attrs} value="${X(value)}"></div>`}
function selectField(name,label,values){return `<div class="form-field"><label class="label" for="f-${name}">${X(label)}</label><select name="${name}" id="f-${name}">${values.map(([v,l])=>`<option value="${X(v)}">${X(l)}</option>`).join('')}</select></div>`}
const submitText=(t)=>`<div class="modal-actions"><button class="btn secondary" type="button" data-action="modal-close">Cancelar</button><button class="btn" type="submit">${X(t)}</button></div>`;
function reserveOpen(){if(reservation()){showReserve();return} if(!availability(state.service)){notify('No hay cupo de prueba para este servicio.');return}openModal('Reservar estacionamiento',`<p class="muted">${X(service().label)} · Disponibilidad estimada: ${availability(state.service)} lugares. No se asigna un cajón específico.</p><form data-form="reserve">${field('vehicle','Vehículo (opcional)','text','placeholder="Ej. Sedán gris" maxlength="70"')}${selectField('arrival','Momento aproximado de llegada',[['Antes de empezar','Antes de empezar'],['Al comenzar','Al comenzar'],['Un poco después','Un poco después']])}${notice('La reservación simulada utiliza el perfil de demostración. En la operación real deberá existir una política de tolerancia y validación de llegada.')}${submitText('Confirmar reservación')}</form>`)}
function showReserve(){const r=reservation();if(!r){notify('No tienes reservación activa en este servicio.');return}openModal('Mi reservación',`<p class="eyebrow">CÓDIGO DE VALIDACIÓN</p><div class="panel-inset" style="text-align:center"><div class="metric-num" style="letter-spacing:1px">${X(r.id)}</div><p class="tiny">Muéstralo al voluntario al llegar · Solo prueba</p></div>${row('Servicio',X(service().label))}${row('Vehículo',X(r.vehicle||'Sin especificar'))}${row('Estado',tags(r.status))}<div class="modal-actions"><button class="btn secondary" data-action="modal-close">Cerrar</button><button class="btn warn" data-action="cancel-reservation" data-id="${r.id}">Cancelar reservación</button></div>`)}
function rolesOpen(){openModal('Explorar experiencia por rol',`<p class="muted">Cambiar de rol permite recorrer las pantallas del prototipo. Los permisos se muestran para probar navegación; no son seguridad real.</p><div class="grid one">${[['persona','Congregante','Tu familia, visitas y actividades'],['voluntario','Voluntario','Operación de domingo'],['admin','Administración','Configuración y control']].map(([id,l,d])=>`<button class="tile" style="min-height:80px" data-action="role" data-id="${id}"><span style="display:flex;justify-content:space-between;width:100%;align-items:center"><strong>${l}</strong>${I('chevron')}</span><span class="tiny">${d}</span></button>`).join('')}</div>`)}
function givingOpen(){openModal('Registrar aportación',`<p class="muted">Este formulario registra una intención de aportación. No realiza un cobro.</p><form data-form="giving"><div class="form-grid">${field('amount','Monto (MXN)','number','required min="1" max="999999" step="1" placeholder="Ej. 200"')}${selectField('concept','Concepto',[['Diezmo','Diezmo'],['Ofrenda','Ofrenda'],['Cooperación para evento','Cooperación para evento'],['Donativo para proyecto','Donativo para proyecto']])}${selectField('method','Medio elegido',[['Transferencia','Transferencia'],['Efectivo','Efectivo'],['Pago en línea (no disponible)','Pago en línea (no disponible)']])}</div>${notice('Todo queda pendiente de conciliación. Nunca ingreses datos de tu tarjeta o comprobantes reales en este prototipo.')}${submitText('Registrar intención')}</form>`)}
function memberOpen(){openModal('Agregar integrante de prueba',`<p class="muted">El nombre no será el identificador único. La relación quedará pendiente de verificación.</p><form data-form="member"><div class="form-grid">${field('name','Nombre de demostración','text','required maxlength="85" placeholder="Ej. Integrante de prueba"')}${selectField('type','Tipo',[['menor','Menor'],['adulto','Adulto']])}${selectField('relationship','Relación',[['Hijo/a','Hijo/a'],['Padre','Padre'],['Madre','Madre'],['Tutor','Tutor'],['Otro','Otro']])}</div>${submitText('Agregar integrante')}</form>`)}
function eventOpen(){openModal('Nuevo evento de demostración',`<form data-form="event"><div class="form-grid">${field('title','Nombre del evento','text','required maxlength="100"')}${field('date','Fecha','date','required')}${field('time','Hora','text','required placeholder="Ej. 7:00 PM"')}${field('place','Sede','text','required maxlength="100"')}${field('capacity','Cupo','number','required min="1" max="5000"','60')}${field('price','Cooperación (MXN)','number','min="0" max="100000"','0')}</div>${submitText('Crear evento')}</form>`)}
function projectOpen(){openModal('Nuevo proyecto de demostración',`<form data-form="project"><div class="form-grid">${field('title','Nombre del proyecto','text','required maxlength="100"')}${field('budget','Presupuesto estimado (MXN)','number','required min="1" max="100000000"')}<div class="form-field full"><label class="label" for="f-description">Descripción</label><textarea id="f-description" name="description" maxlength="400" required></textarea></div></div>${submitText('Crear proyecto')}</form>`)}
function noticeOpen(){location.href='comunicaciones.html#admin'}
function productOpen(){openModal('Agregar producto de prueba',`<form data-form="product"><div class="form-grid">${field('name','Producto','text','required maxlength="75"')}${field('price','Precio (MXN)','number','required min="1" max="9999"')}${field('stock','Existencias','number','required min="0" max="9999"','10')}</div>${submitText('Agregar al menú')}</form>`)}
function expenseOpen(id){let p=state.projects.find(p=>p.id===id);if(!p)return;openModal('Registrar gasto de prueba',`<p class="muted">${X(p.title)} · Gastado: ${money(p.spent)} de ${money(p.budget)}</p><form data-form="expense"><input type="hidden" name="project" value="${X(p.id)}">${field('amount','Gasto (MXN)','number','required min="1" max="99999999"')}${field('description','Concepto','text','required maxlength="100"')}${submitText('Agregar gasto')}</form>`)}
function checkoutOpen(){const cart=Object.entries(state.cafe.cart).filter(([k,v])=>v>0);if(!cart.length){notify('Tu carrito está vacío.');return}openModal('Preparar pedido de ejemplo',`<p class="muted">Confirmar no enviará el pedido a la cafetería ni cobrará dinero.</p><form data-form="checkout">${selectField('method','Método de pago al recoger',[['Efectivo al recoger','Efectivo al recoger'],['Terminal física al recoger','Terminal física al recoger']])}${submitText('Confirmar pedido simulado')}</form>`)}
function manage(action,id){switch(action){case'goto':goto(id);return;case'service':state.service=id;break;case'role':if(!state.session)return goto('login');state.role=id;state.session.role=id;state.screen='home';modal=null;break;case'signin':if(!['persona','voluntario','admin'].includes(id))return;state.session={role:id,kind:'demo'};state.role=id;state.screen=['agenda','family','kids','giving','cafe','projects','volunteer','admin','people','settings','profile'].includes(state.redirectAfterLogin)?state.redirectAfterLogin:'home';if((['volunteer','agenda'].includes(state.screen)&&id==='persona')||(['admin','people','settings'].includes(state.screen)&&id!=='admin'))state.screen='home';state.redirectAfterLogin=null;modal=null;notify('Ingresaste a un perfil ficticio. No es una sesión real.');break;case'signout':state.session=null;state.role='persona';state.screen='home';modal=null;notify('Saliste de la demostración.');break;case'play-notice':videoOpen(id);return;case'roles':rolesOpen();return;case'theme':state.theme=state.theme==='night'?'cream':'night';window.ShalomTheme.set(state.theme);break;case'reserve':if(!state.session){state.redirectAfterLogin='parking';goto('login');return}reserveOpen();return;case'reserve-show':showReserve();return;case'cancel-reservation':{let r=state.parking.reservations.find(x=>x.id===id);if(r){r.status='Cancelado';log('Cancelación de reserva '+id)}modal=null;notify('Reservación de prueba cancelada.');break;}case'event-enroll':{if(!state.session){state.redirectAfterLogin='events';goto('login');return}let e=state.events.find(e=>e.id===id);if(e&&e.registered.length<e.capacity&&!e.registered.includes(state.demoPerson)){e.registered.push(state.demoPerson);log('Inscripción a evento '+e.title);notify('Inscripción de demostración registrada.')}break;}case'event-cancel':{let e=state.events.find(e=>e.id===id);if(e){e.registered=e.registered.filter(x=>x!==state.demoPerson);log('Cancelación de inscripción '+e.title);notify('Inscripción de demostración cancelada.')}break;}case'movement-in':case'movement-out':{let s=service(),inc=action==='movement-in'?1:-1;if(s.occupied+inc<0){notify('No hay vehículos para registrar salida.');return}if(inc>0&&availability(s.id)<=0){notify('No hay cupo libre en la simulación.');return}s.occupied+=inc;state.parking.movements.unshift({service:s.id,type:inc>0?'Entrada':'Salida',date:new Date().toISOString()});log((inc>0?'Entrada':'Salida')+' en '+s.label);notify(inc>0?'Entrada registrada en la demo.':'Salida registrada en la demo.');break;}case'confirm-giving':{if(state.role!=='admin'){notify('Esta operación se reserva a administración en la demo.');return}let d=state.giving.find(x=>x.id===id);if(d&&d.status==='Pendiente'){d.status='Confirmada';log('Conciliación simulada de '+d.id);notify('Movimiento marcado como confirmado en la demo.')}break;}case'order-deliver':{if(state.role!=='admin')return;let o=state.cafe.orders.find(x=>x.id===id);if(o){o.status='Entregado';log('Entrega de pedido '+id);notify('Pedido marcado como entregado.')}break;}case'add-giving':givingOpen();return;case'add-member':memberOpen();return;case'add-event':eventOpen();return;case'add-project':projectOpen();return;case'add-notice':if(!state.session||state.role!=='admin')return;noticeOpen();return;case'add-product':productOpen();return;case'expense':expenseOpen(id);return;case'verify-member':{let m=state.family.members.find(x=>x.id===id);if(m){m.verified=true;log('Verificación simulada de '+m.id);notify('Relación verificada solo en esta demo.')}break;}case'cart-add':case'cart-remove':{const p=state.cafe.products.find(x=>x.id===id);if(!p)return;const current=state.cafe.cart[id]||0;const next=Math.max(0,Math.min(p.stock,current+(action==='cart-add'?1:-1)));state.cafe.cart[id]=next;break;}case'cafe-checkout':checkoutOpen();return;case'giving-csv':window.ShalomProcessing.requestExport({source:'Estado de aportaciones ficticias',count:state.giving.filter(d=>d.person===state.demoPerson).length});return;case'export':window.ShalomProcessing.requestExport({source:'Datos del perfil ficticio',count:1});return;case'reset':openModal('Restablecer demostración',`<p class="muted">Se eliminarán los cambios de prueba guardados en este navegador y se cargarán de nuevo los valores iniciales.</p><div class="modal-actions"><button class="btn secondary" data-action="modal-close">Conservar</button><button class="btn warn" data-action="reset-confirm">Restablecer demo</button></div>`);return;case'reset-confirm':{window.ShalomNotifications.clear();state=seed();state.theme=window.ShalomTheme.get();modal=null;notify('Demostración restablecida.');break;}case'modal-close':modal=null;break;default:return}render()}
function submitForm(f){const d=Object.fromEntries(new FormData(f).entries());const kind=f.dataset.form;const num=(n)=>Number(d[n]);switch(kind){case'reserve':if(reservation()||availability(state.service)<1){notify('No hay disponibilidad para reservar.');return}state.parking.reservations.push({id:nextId('R'),person:state.demoPerson,service:state.service,vehicle:d.vehicle.slice(0,70),arrival:d.arrival,status:'Reservado',date:today()});log('Reservación creada · '+state.service);modal=null;render();showReserve();notify('Reservación de demostración confirmada.');return;case'giving':if(num('amount')<=0)return;state.giving.unshift({id:nextId('D'),person:state.demoPerson,amount:num('amount'),concept:d.concept,method:d.method,status:'Pendiente',date:today()});log('Registro de intención de aportación');notify('Aportación registrada como pendiente, sin realizar cobro.');break;case'member':state.family.members.push({id:nextId('PER'),name:d.name.trim(),type:d.type,relationship:d.relationship,verified:false});log('Alta de persona en demo');notify('Integrante agregado, pendiente de verificación.');break;case'event':state.events.unshift({id:nextId('E'),title:d.title.trim(),date:d.date,time:d.time.trim(),place:d.place.trim(),capacity:num('capacity'),price:num('price'),registered:[],external:false});log('Evento agregado');notify('Evento de prueba creado.');break;case'project':state.projects.unshift({id:nextId('P'),title:d.title.trim(),description:d.description.trim(),budget:num('budget'),spent:0,status:'En planeación',public:true});log('Proyecto de prueba creado');notify('Proyecto creado.');break;case'notice':notify('Usa el nuevo módulo de comunicaciones.');return;case'product':state.cafe.products.push({id:nextId('C'),name:d.name.trim(),price:num('price'),stock:num('stock')});log('Producto de cafetería creado');notify('Producto agregado a menú de demostración.');break;case'expense':{let p=state.projects.find(x=>x.id===d.project);if(!p)return;p.spent+=num('amount');log('Gasto de prueba: '+d.description);notify('Gasto de prueba agregado.');break;}case'attendance':{if(state.role==='persona'){notify('Solo el equipo autorizado registra asistencia.');return}state.kids.attendance.unshift({id:nextId('A'),student:d.student,date:today(),group:d.group,status:d.status});log('Asistencia de prueba '+d.student+' · '+d.status);notify('Movimiento de Shalom Kids registrado solo en la demo.');break;}case'capacity':{let c=num('capacity');if(!Number.isInteger(c)||c<=0)return;state.parking.capacity=c;log('Capacidad ajustada a '+c);notify('Capacidad de prueba actualizada.');break;}case'checkout':{let cart=Object.entries(state.cafe.cart).filter(([k,v])=>v>0);let total=cart.reduce((a,[k,v])=>a+(state.cafe.products.find(p=>p.id===k)?.price||0)*v,0);state.cafe.orders.unshift({id:nextId('PED'),items:cart.reduce((a,[_k,v])=>a+v,0),total,method:d.method,status:'Por recoger'});for(let [pid,qty] of cart){const p=state.cafe.products.find(p=>p.id===pid);if(p)p.stock=Math.max(0,p.stock-qty)}state.cafe.cart={};log('Pedido de cafetería de prueba');notify('Pedido simulado creado. No se ha cobrado.');break;}case'checkin':{let code=d.code.trim().toUpperCase();let r=state.parking.reservations.find(r=>r.id.toUpperCase()===code&&r.status==='Reservado');if(!r){notify('Código no encontrado o ya utilizado en esta demo.');return}let s=state.parking.services.find(s=>s.id===r.service);if(!s||s.occupied>=state.parking.capacity){notify('No se puede validar: verifica la capacidad.');return}r.status='Ingresó';s.occupied++;log('Validación de entrada '+r.id);notify('Reservación validada. Entrada registrada.');break;}default:return}modal=null;render()}
document.addEventListener('click',e=>{if(e.target.closest('[data-dismiss]')&&!e.target.closest('.modal-box')){modal=null;render();return}const b=e.target.closest('[data-action]');if(!b)return;manage(b.dataset.action,b.dataset.id)});
document.addEventListener('change',e=>{if(e.target.id==='role'&&state.session){state.role=e.target.value;state.session.role=state.role;state.screen='home';modal=null;render()}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(!f.reportValidity())return;submitForm(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
document.addEventListener('shalomthemechange',e=>{if(state.theme!==e.detail.theme){state.theme=e.detail.theme;render()}});
</script>
