name: Security and backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shalom
          POSTGRES_DB: shalom_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SHALOM_ENV: test
      PGDATABASE: shalom_test
      PGUSER: shalom
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/install_gitleaks.py
      - run: python scripts/test_security_gate.py
      - run: python scripts/security_gate.py
      - run: python scripts/security_gate.py --history
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test core
      - name: Scripts de infraestructura en simulación
        run: for script in infra/staging/0*.sh; do SHALOM_INFRA_CONFIG=infra/staging/config.example.sh bash "$script" > /dev/null; done

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build -t shalom-api:ci backend
      - name: La imagen arranca con usuario sin privilegios y settings de producción
        run: |
          test "$(docker run --rm shalom-api:ci id -u)" = 10001
          docker run --rm -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)" -e SHALOM_FIELD_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            -e DJANGO_ALLOWED_HOSTS=api.example.invalid -e SHALOM_PUBLIC_APP_URL=https://app.example.invalid \
            shalom-api:ci python manage.py check --deploy --fail-level WARNING

  frontend-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: node tests/ux-guardrails.cjs
      - run: node tests/theme-persistence.cjs
      - run: node tests/site-navigation.cjs
      - run: node tests/family-registration.cjs
      - run: node tests/visual-identity.cjs
      - run: node tests/manual-celular.cjs

  access-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shalom
          POSTGRES_DB: shalom_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGDATABASE: shalom_e2e
      PGUSER: shalom
      PGHOST: 127.0.0.1
      PYTHON: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
      - run: node tests/acceso-react.cjs
      - run: npm run build --prefix frontend
      - run: node tests/hosting-staging.cjs
