name: Security and backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shalom
          POSTGRES_DB: shalom_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SHALOM_ENV: test
      PGDATABASE: shalom_test
      PGUSER: shalom
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/install_gitleaks.py
      - run: python scripts/test_security_gate.py
      - run: python scripts/security_gate.py
      - run: python scripts/security_gate.py --history
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test core

  frontend-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: node tests/ux-guardrails.cjs
      - run: node tests/theme-persistence.cjs
      - run: node tests/site-navigation.cjs
      - run: node tests/family-registration.cjs
      - run: node tests/visual-identity.cjs
      - run: node tests/manual-celular.cjs
