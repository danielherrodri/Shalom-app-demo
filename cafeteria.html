function page(){if(tab==='caja')return caja();if(tab==='cocina')return cocina();if(tab==='seguimiento')return seguimiento();return propuesta()}
function caja(){let items=PRODUCTS.filter(p=>category==='Todos'||p.cat===category);return `${bar('OPERACIÓN DE MOSTRADOR','Caja rápida','Registra una sola vez el producto exacto. El pedido llegará automáticamente a preparación después de marcar el cobro de prueba.',`<button class="outline" data-action="client-view">${icon('eye')} Pantalla del cliente</button>`)}<div class="note">${icon('info')} <span><strong>Simulación.</strong> Los precios son ejemplos, no hay cargo a la terminal. La sincronización entre pantallas funciona únicamente en este navegador y sus pestañas, no entre dispositivos distintos.</span></div><div class="pos-layout section-space"><section><div class="section-title"><h2>Menú para registrar</h2><small>${PRODUCTS.length} productos de ejemplo</small></div><div class="filter">${['Todos','Bebidas','Alimentos','Panadería'].map(c=>`<button class="chip ${c===category?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="product-grid">${items.map(p=>`<button class="product" data-product="${p.id}"><span class="symbol">${icon(p.symbol)}</span><span class="pname">${esc(p.name)}</span><span class="psub">${esc(p.detail)}</span><span class="pprice">${money(p.price)}</span></button>`).join('')}</div><div class="note section-space">${icon('info')} <span>Productos distintos aunque compartan categoría o precio. Las preferencias de preparación se guardan en cada línea de pedido.</span></div></section><aside class="surface summary ${cartMotion?'cart-updated':''}"><div class="summary-head"><div><div class="eyebrow">RESUMEN EN CAJA</div><h2>Pedido actual</h2><p class="tiny">Visible también en la pantalla del cliente</p></div><button class="quiet" data-action="clear-cart" ${cart.length?'':'disabled'}>Limpiar</button></div>${cart.length?`<div class="order-lines">${cart.map((l,i)=>`<div class="order-line"><div><strong>${esc(l.name)}</strong>${l.options.length?`<div class="details">${esc(l.options.join(' · '))}</div>`:''}<div class="qty"><button data-action="cart-minus" data-i="${i}" aria-label="Quitar uno">−</button><span>${l.qty}</span><button data-action="cart-plus" data-i="${i}" aria-label="Agregar uno">+</button></div></div><span class="price">${money(l.unit*l.qty)}</span></div>`).join('')}</div>`:`<div class="empty-cart">${icon('bag')}<span>Aún no hay productos.<br>Selecciona un artículo del menú.</span></div>`}<div class="total"><span>Total del pedido</span><strong>${money(cartTotal())}</strong></div><div class="field"><label for="paymethod">Método reportado en caja</label><select id="paymethod"><option ${payMethod==='Terminal Mercado Pago'?'selected':''}>Terminal Mercado Pago</option><option ${payMethod==='Efectivo'?'selected':''}>Efectivo</option></select></div><div class="field"><label for="custemail">Correo para recibo (opcional · demo)</label><input class="input" id="custemail" type="email" value="${esc(customerEmail)}" placeholder="ejemplo@correo.test" autocomplete="off"><span class="input-hint">No se envía correo. No captures direcciones reales en esta demo.</span></div><label class="checkline"><input type="checkbox" id="paidConfirm" ${confirmed?'checked':''}><span>Confirmo, para esta demostración, que el pago fue recibido fuera de la aplicación.</span></label><button class="btn wide" data-action="place-order" ${cart.length&&confirmed?'':'disabled'}>${icon('check')} Confirmar y enviar comanda</button><button class="outline wide section-space" data-action="client-view">${icon('eye')} Mostrar resumen al cliente</button></aside></div>`}
function stationCard(o,st){const lines=o.lines.filter(l=>l.station===st);if(!lines.length)return '';const status=lines.every(l=>l.status==='listo')?'listo':lines.some(l=>l.status==='preparando')?'preparando':'pendiente';let mins=Math.floor((stamp()-o.created)/60000),threshold=st==='bebidas'?8:15;return `<article class="ticket ${lastNewOrderId===o.id?'is-new':''} ${recentAdvance?.id===o.id&&recentAdvance?.station===st?'is-updated':''}"><div class="ticket-top"><div><div class="eyebrow">${st==='bebidas'?'BEBIDAS':'ALIMENTOS'}</div><h3>#${esc(o.id)}</h3><span class="timer ${status!=='listo'&&mins>=threshold?'warn':''}">${icon('clock')} ${age(o.created)}${status!=='listo'&&mins>=threshold?' · Revisar demora':''}</span></div><span class="status ${status}">${statusWord(status)}</span></div><div class="ticket-content"><div class="ticket-lines">${lines.map(l=>`<div class="ticket-line"><span class="item-num">${l.qty}×</span><div><strong>${esc(l.name)}</strong>${l.options.length?`<small>${esc(l.options.join(' · '))}</small>`:''}</div></div>`).join('')}</div>${status==='pendiente'?`<button class="btn wide" data-action="advance" data-id="${o.id}" data-station="${st}">Iniciar preparación ${icon('arrow')}</button>`:status==='preparando'?`<button class="btn wide" data-action="advance" data-id="${o.id}" data-station="${st}">Marcar listo ${icon('check')}</button>`:`<button class="outline wide" disabled>${icon('check')} Listo para entregar</button>`}</div></article>`}
function cocina(){const all=active();let tickets=[];for(const o of all){for(const st of ['bebidas','alimentos']){if(station==='todos'||station===st){let x=stationCard(o,st);if(x)tickets.push({time:o.created,html:x})}}}tickets.sort((a,b)=>a.time-b.time);let n=counts();return `${bar('COMANDAS EN TIEMPO REAL · DEMO','Pantalla de preparación','Cocina recibe bebidas y alimentos por separado. Todos ven el número del pedido, cantidades, modificaciones y tiempo de espera.') }<div class="stats"><div class="stat"><small>En espera</small><div class="number">${n.pending}</div><div class="meta">Pedidos por iniciar</div></div><div class="stat"><small>Preparando</small><div class="number">${n.working}</div><div class="meta">Al menos una estación activa</div></div><div class="stat"><small>Listos</small><div class="number">${n.ready}</div><div class="meta">Pendientes de entregar</div></div></div><div class="kds-header"><h2>Comandas activas</h2><div class="filter" style="margin:0">${[['todos','Todas'],['bebidas','Bebidas'],['alimentos','Alimentos']].map(([id,label])=>`<button class="chip ${station===id?'on':''}" data-station-filter="${id}">${label}</button>`).join('')}</div></div>${tickets.length?`<div class="tickets">${tickets.map(t=>t.html).join('')}</div>`:`<section class="surface"><p class="muted">No hay comandas activas para esta estación.</p></section>`}<div class="note section-space">${icon('info')} <span>Las tarjetas de bebidas y alimentos pueden avanzar de forma independiente. Los umbrales visuales de demostración son 8 min para bebidas y 15 min para alimentos; deberán ajustarse tras medir el servicio real.</span></div>`}
function orderStatusCard(o){let s=overall(o);return `<div class="tracking-ticket ${recentAdvance?.id===o.id?'is-updated':''}"><div class="section-title"><div><div class="eyebrow">NÚMERO DE ORDEN</div><h2>#${esc(o.id)}</h2><small>${shortTime(o.created)} · ${age(o.created)}</small></div><span class="status ${s}">${statusWord(s)}</span></div><div class="timeline">${[['pendiente','Pedido registrado','Pago registrado en caja (simulación)'],['preparando','En preparación','Cada estación procesa sus artículos'],['listo','Listo para recoger','Bebidas y alimentos terminados'],['entregado','Entregado','Pedido finalizado']].map(([v,n,desc],i)=>{let idx=['pendiente','preparando','listo','entregado'].indexOf(s);return `<div class="step ${idx>=i?'done':''}"><span class="dot"></span><div><strong>${n}</strong><p>${desc}</p></div></div>`}).join('')}</div><div class="section-title"><h3>Detalle de tu pedido</h3><strong>${money(subtotal(o.lines))}</strong></div>${o.lines.map(l=>`<div class="list-row"><div><strong>${l.qty} × ${esc(l.name)}</strong>${l.options.length?`<small>${esc(l.options.join(' · '))}</small>`:''}</div><span class="status ${l.status}">${statusWord(l.status)}</span></div>`).join('')}<div class="modal-bottom" style="justify-content:space-between"><button class="outline small" data-action="receipt" data-id="${o.id}">${icon('track')} Ver recibo</button>${s==='listo'?`<button class="btn small" data-action="deliver" data-id="${o.id}">${icon('check')} Marcar entregado (demo)</button>`:''}</div></div>`}
function seguimiento(){let o=orderSearch?where(orderSearch.trim().replace(/^#/,'')):data.orders[0];let ready=active().filter(x=>overall(x)==='listo');return `${bar('CONSULTA Y ENTREGA','Seguimiento del pedido','La persona consulta su número de orden y ve los artículos exactos y el avance. En producción esta pantalla tendrá un enlace protegido.') }<div class="tracking"><section class="surface tracking-card"><div class="section-title"><h2>Consulta tu comanda</h2><span class="tiny-pill">Datos ficticios</span></div><div class="field"><label for="orderNumber">Número de pedido</label><div style="display:flex;gap:8px"><input class="input" type="text" id="orderNumber" value="${esc(orderSearch)}" placeholder="Ej. S-0031" style="flex:1"><button class="outline" data-action="search-order">${icon('track')} Buscar</button></div></div>${o?orderStatusCard(o):`<div class="note section-space">${icon('info')} <span>Pedido no encontrado. Prueba S-0031 o genera uno desde la caja.</span></div>`}</section><section><section class="surface"><div class="section-title"><h2>Listos para entregar</h2><span class="status listo">${ready.length} listos</span></div>${ready.length?ready.map(v=>`<div class="list-row"><div><strong>#${esc(v.id)}</strong><small>${v.lines.reduce((n,l)=>n+l.qty,0)} artículos · ${age(v.created)}</small></div><button class="outline small" data-action="track" data-id="${v.id}">Ver ${icon('arrow')}</button></div>`).join(''):`<p class="muted">Aún no hay pedidos completamente listos.</p>`}</section><section class="surface section-space"><div class="eyebrow">RECIBO DIGITAL</div><h2>Como un resumen de compra</h2><p class="lead">Artículos, modificaciones, importe, método de pago y número de pedido. El envío automático por correo necesita backend y servicio de email.</p><button class="outline section-space" data-action="receipt" data-id="${o?.id||''}" ${o?'':'disabled'}>${icon('mail')} Previsualizar correo</button></section></section></div>`}
function propuesta(){return `${bar('ROADMAP · PRODUCTO','Propuesta de implementación','La demostración valida los flujos visuales; no sustituye un sistema transaccional seguro y sincronizado entre tablets.') }<div class="proposal-grid"><section class="surface"><div class="step-number">FASE 01 · OPERACIÓN</div><h2>Una sola captura</h2><p>Catálogo específico, caja rápida, pantalla orientada al cliente y pago confirmado manualmente. Una comanda alimenta las estaciones de preparación, sin volver a escribir a mano.</p></section><section class="surface"><div class="step-number">FASE 02 · COMUNICACIÓN</div><h2>Pedidos y recibos</h2><p>Servidor, base de datos, seguimiento entre dispositivos y envío de correos transaccionales en segundo plano. Sin detener caja por un fallo en correo.</p></section><section class="surface"><div class="step-number">FASE 03 · OPTIMIZACIÓN</div><h2>Inventario e integración</h2><p>Reportes por producto, tiempos, mermas, conciliación y estudio de compatibilidad de la terminal Mercado Pago para vincular importes y confirmar pagos.</p></section></div><section class="surface section-space"><div class="section-title"><h2>Qué necesitamos para producción</h2><span class="tiny-pill">Pendiente de desarrollo</span></div><table class="matrix"><thead><tr><th>Componente</th><th>Primera etapa productiva</th><th>Motivo</th></tr></thead><tbody><tr><td>Base de datos</td><td>PostgreSQL</td><td>Transacciones, idempotencia, auditoría, respaldo</td></tr><tr><td>Backend</td><td>Django/DRF o Node</td><td>Sincronización, autenticación y roles por estación</td></tr><tr><td>Pedidos</td><td>Eventos SSE/WebSocket con reconexión</td><td>Actualizaciones entre tablets y cocina</td></tr><tr><td>Email</td><td>Cola de trabajo + proveedor transaccional</td><td>Recibos sin retrasar a la cajera</td></tr><tr><td>Mercado Pago</td><td>Captura manual inicialmente</td><td>Revisar terminal y API antes de integrar</td></tr><tr><td>Continuidad</td><td>Monitoreo y procedimiento sin red</td><td>No perder órdenes si falla internet</td></tr></tbody></table></section><section class="note section-space">${icon('warning')} <span>Objetivo técnico preliminar: diseñar y probar para 10 pedidos nuevos por minuto, no prometerlo como capacidad real antes de pruebas. Los 15–20 minutos actuales de alimentos y ~10 de café se usarán como línea base para comparar mejoras.</span></section>`}
function clientView(){return `<div class="modal-head"><div><div class="eyebrow">SEGUNDA PANTALLA · DEMO</div><h2>Resumen del cliente</h2><p class="muted">Se actualiza con los productos elegidos en caja</p></div><button class="icon-btn" data-close aria-label="Cerrar">${icon('x')}</button></div><div class="client-window"><div class="client-head"><div><div class="eyebrow">TU PEDIDO</div><h2>Esto es lo que llevas</h2></div><span class="tiny-pill">Sin cargo real</span></div><div class="client-items">${cart.length?cart.map(l=>`<div class="client-item"><div><strong>${l.qty} × ${esc(l.name)}</strong>${l.options.length?`<p class="muted">${esc(l.options.join(' · '))}</p>`:''}</div><strong>${money(l.qty*l.unit)}</strong></div>`).join(''):'<p class="muted">Tu pedido aparecerá cuando la caja seleccione productos.</p>'}</div><p class="muted">Total a pagar</p><div class="client-total">${money(cartTotal())}</div></div><div class="note section-space">${icon('info')} <span>La pantalla real orientada al cliente tendría su propia sesión de solo lectura, conectada a la caja por servidor. Esta es una vista previa.</span></div>`}
function optionModal(p){const base=({cafe:[['Tipo de café',['Normal','Descafeinado']]],leche:[['Leche',['Entera','Deslactosada','Vegetal (+$8)']]],comida:[['Indicaciones',['Preparación normal','Sin cebolla','Salsa aparte']]]})[p.options]||[];return `<div class="modal-head"><div><div class="eyebrow">PERSONALIZA EL PRODUCTO</div><h2>${esc(p.name)}</h2><p class="muted">${money(p.price)} · ${esc(p.cat)}</p></div><button class="icon-btn" data-close>${icon('x')}</button></div>${base.map(([key,opts],j)=>`<div class="kicker">${esc(key)}</div><div class="option-group">${opts.map((v,i)=>`<label class="check-option"><input type="radio" name="option${j}" value="${esc(v)}" ${i===0?'checked':''}><span>${esc(v)}</span></label>`).join('')}</div>`).join('')}<div class="modal-bottom"><button class="outline" data-close>Cancelar</button><button class="btn" data-action="add-configured">${icon('plus')} Agregar al pedido</button></div>`}
function receiptModal(o){const total=subtotal(o.lines);return `<div class="modal-head"><div><div class="eyebrow">VISTA PREVIA DE CORREO</div><h2>Tu recibo digital</h2><p class="muted">No se ha enviado ningún correo.</p></div><button class="icon-btn" data-close aria-label="Cerrar">${icon('x')}</button></div><div class="receipt" id="print-receipt"><div class="receipt-eyebrow">SHALOM · CAFETERÍA</div><h2>Gracias por tu compra</h2><p>Una casa para todos. Este es el resumen de tu pedido.</p><hr><div class="receipt-row"><strong>Orden #${esc(o.id)}</strong><span>${shortTime(o.created)}</span></div><div class="receipt-row"><span>Pago registrado (simulado)</span><strong>${esc(o.paidMethod)}</strong></div><hr>${o.lines.map(l=>`<div class="receipt-row"><div><strong>${l.qty} × ${esc(l.name)}</strong>${l.options.length?`<p>${esc(l.options.join(' · '))}</p>`:''}</div><span>${money(l.qty*l.unit)}</span></div>`).join('')}<hr><div class="receipt-row"><strong>Total</strong><span class="receipt-total">${money(total)}</span></div><p>Consulta tu pedido con el número ${esc(o.id)} en Cafetería Shalom.</p><p style="margin-top:18px">Recibo de demostración. No constituye CFDI ni comprobante de pago del proveedor.</p></div><div class="note section-space">${icon('mail')} <span>En producción se enviaría automáticamente después de confirmar el pago. Aquí solo mostramos la plantilla; no almacenamos destinatarios reales.</span></div><div class="modal-bottom"><button class="outline" data-action="print">${icon('print')} Imprimir / guardar PDF</button><button class="btn" data-close>Entendido</button></div>`}
function render(){document.getElementById('app').innerHTML=layout();const modal=document.getElementById('dialog');let inner='';if(dialog==='client')inner=clientView();if(dialog==='options'){const p=PRODUCTS.find(x=>x.id===selectedProduct);if(p)inner=optionModal(p)}if(dialog.startsWith('receipt:')){const o=where(dialog.slice(8));if(o)inner=receiptModal(o)}if(dialog==='reset')inner=`<div class="modal-head"><div><div class="eyebrow">REINICIAR</div><h2>Restablecer datos de prueba</h2></div><button class="icon-btn" data-close>${icon('x')}</button></div><p class="muted">Se restaurarán pedidos ficticios y se vaciará tu carrito. No afecta ningún sistema de Shalom.</p><div class="modal-bottom"><button class="outline" data-close>Cancelar</button><button class="btn" data-action="reset-confirm">Reiniciar demo</button></div>`;viewMotion=false;cartMotion=false;if(tab==='cocina')lastNewOrderId=null;recentAdvance=null;modal.innerHTML=inner?`<div class="modal-wrap" data-backdrop><div class="modal" role="dialog" aria-modal="true" aria-label="${dialog==='options'?'Personalizar pedido':'Detalle de demostración'}">${inner}</div></div>`:''}
function put(p,opts=[]){let addon=opts.some(x=>x.includes('+$8'))?8:0;const name=p.name,unit=p.price+addon,options=opts.map(x=>x.replace(' (+$8)',''));const old=cart.find(l=>l.id===p.id&&l.unit===unit&&l.options.join('|')===options.join('|'));if(old)old.qty++;else cart.push({id:p.id,unit,name,station:p.station,qty:1,options});confirmed=false;cartMotion=true;render();toast(`${name} agregado al pedido`)}
function advance(id,st){const o=where(id);if(!o||o.delivered)return;const lines=o.lines.filter(l=>l.station===st);const next=lines.every(l=>l.status==='pendiente')?'preparando':'listo';for(const l of lines)if(l.status!=='listo')l.status=next;save();recentAdvance={id,station:st};render();toast(`${id}: ${st==='bebidas'?'Bebidas':'Alimentos'} · ${statusWord(next)}`)}
function createOrder(){if(!confirmed||!cart.length)return;const id=`S-${String(data.nextNumber++).padStart(4,'0')}`;const o={id,created:stamp(),paid:true,paidMethod:payMethod+' (registro manual)',delivered:false,lines:cart.map((x,i)=>({...x,id:id+'-'+i,status:'pendiente'}))};data.orders.unshift(o);data.orders=data.orders.slice(0,100);lastNewOrderId=id;save();cart=[];confirmed=false;customerEmail='';orderSearch=id;tab='seguimiento';viewMotion=true;dialog='receipt:'+id;render();toast(`Pedido ${id} registrado. Pago simulado y comanda enviada a cocina.`)}
document.addEventListener('click',e=>{if(e.target.hasAttribute('data-backdrop')){dialog='';render();return}const el=e.target.closest('[data-tab],[data-action],[data-cat],[data-product],[data-station-filter],[data-close]');if(!el)return;if(el.hasAttribute('data-tab')){viewMotion=tab!==el.dataset.tab;tab=el.dataset.tab;dialog='';render();window.scrollTo(0,0);return}if(el.hasAttribute('data-close')){dialog='';render();return}if(el.hasAttribute('data-cat')){category=el.dataset.cat;render();return}if(el.hasAttribute('data-station-filter')){station=el.dataset.stationFilter;render();return}if(el.hasAttribute('data-product')){const p=PRODUCTS.find(v=>v.id===el.dataset.product);if(!p)return;if(p.options==='none'){put(p);return}selectedProduct=p.id;dialog='options';render();return}const a=el.dataset.action,id=el.dataset.id;
if(a==='clear-cart'){cart=[];confirmed=false;render();return}if(a==='cart-plus'||a==='cart-minus'){const i=Number(el.dataset.i);if(cart[i]){cart[i].qty+=a==='cart-plus'?1:-1;if(cart[i].qty<=0)cart.splice(i,1);confirmed=false;cartMotion=true;render()}return}if(a==='client-view'){dialog='client';render();return}if(a==='add-configured'){const p=PRODUCTS.find(v=>v.id===selectedProduct);const opts=[...document.querySelectorAll('.modal input[type=radio]:checked')].map(el=>el.value);dialog='';if(p)put(p,opts);return}if(a==='place-order'){createOrder();return}if(a==='advance'){advance(id,el.dataset.station);return}if(a==='search-order'){orderSearch=document.getElementById('orderNumber')?.value?.trim()||'';render();return}if(a==='track'){orderSearch=id;render();return}if(a==='receipt'){if(id&&where(id)){dialog='receipt:'+id;render()}return}if(a==='deliver'){const o=where(id);if(o&&overall(o)==='listo'){o.delivered=true;save();render();toast(`${id} entregado (demo)`)}return}if(a==='print'){window.print();return}if(a==='reset'){dialog='reset';render();return}if(a==='reset-confirm'){data=starter();cart=[];confirmed=false;orderSearch='';dialog='';save();tab='caja';viewMotion=true;render();toast('Demo reiniciada');return}});
document.addEventListener('change',e=>{if(e.target.id==='paymethod'){payMethod=e.target.value;confirmed=false;const c=document.getElementById('paidConfirm');if(c)c.checked=false}if(e.target.id==='paidConfirm'){confirmed=e.target.checked;render()} });
document.addEventListener('input',e=>{if(e.target.id==='custemail')customerEmail=e.target.value;if(e.target.id==='orderNumber')orderSearch=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog='';render()}if(e.key==='Enter'&&document.activeElement?.id==='orderNumber'){orderSearch=document.activeElement.value.trim();render()}});
setInterval(()=>{if(tab==='cocina'&&!dialog)render()},45000);
render();
})();
</script>
</body>
</html>
